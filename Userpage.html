<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ResumeForge | Your Details</title>
    <!-- Google Fonts + Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a0e27, #060914);
            color: #eef2ff;
            line-height: 1.5;
            min-height: 100vh;
            padding: 24px;
        }

        /* Main App Container - Glassmorphic premium */
        .app-wrapper {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(10, 14, 35, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            box-shadow: 0 25px 60px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 210, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header - Neon touch */
        .header {
            background: rgba(5, 8, 22, 0.6);
            padding: 22px 44px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            background: linear-gradient(145deg, #00d2ff, #3a7bd5);
            width: 48px;
            height: 48px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0a0c1a;
            font-size: 1.5rem;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #00d2ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .header-badge {
            background: rgba(0, 210, 255, 0.12);
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #00d2ff;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        /* Progress Steps - Futuristic timeline */
        .progress-steps {
            background: rgba(5, 8, 22, 0.5);
            padding: 18px 44px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.12);
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #5b6e9e;
        }

        .step.active {
            color: #00d2ff;
        }

        .step.active .step-number {
            background: linear-gradient(145deg, #00d2ff, #3a7bd5);
            color: #0a0c1a;
            border-color: transparent;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
        }

        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 30px;
            background: rgba(20, 25, 50, 0.8);
            border: 1px solid #2a2f55;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #8b9dcc;
        }

        .step.completed .step-number {
            background: #00d2ff;
            border-color: #00d2ff;
            color: #0a0c1a;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        .step.completed {
            color: #a5f3fc;
        }

        /* Form Container */
        .form-container {
            padding: 44px 52px;
            flex: 1;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px 40px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #a5b4fc;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        label i {
            color: #00d2ff;
            width: 18px;
            font-size: 0.85rem;
        }

        input {
            padding: 14px 20px;
            border: 1.5px solid #1e2445;
            border-radius: 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            background: rgba(8, 11, 28, 0.8);
            color: #eef2ff;
            outline: none;
        }

        input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 0 4px rgba(0, 210, 255, 0.15);
            background: rgba(12, 16, 35, 0.95);
        }

        input::placeholder {
            color: #4a5578;
        }

        .error-msg {
            font-size: 0.7rem;
            color: #ff6b6b;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        input.error-border {
            border-color: #ff4757;
            background: rgba(255, 71, 87, 0.08);
        }

        /* Buttons - Cyber style */
        .action-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 52px;
            border-top: 1px solid rgba(0, 210, 255, 0.15);
            padding-top: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .back-btn {
            background: rgba(30, 35, 65, 0.8);
            color: #cbd5ff;
            border: 1px solid #2a2f55;
            padding: 14px 34px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
        }

        .back-btn i {
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: rgba(0, 210, 255, 0.12);
            border-color: #00d2ff;
            color: #00d2ff;
            transform: translateY(-2px);
        }

        .next-btn {
            background: linear-gradient(105deg, #00d2ff, #3a7bd5);
            color: #0a0c1a;
            border: none;
            padding: 14px 42px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px -8px rgba(0, 210, 255, 0.4);
        }

        .next-btn i {
            font-size: 0.9rem;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 28px -10px rgba(0, 210, 255, 0.6);
            filter: brightness(1.05);
        }

        /* Footer */
        .footer {
            background: rgba(5, 8, 22, 0.6);
            padding: 20px 44px;
            text-align: center;
            border-top: 1px solid rgba(0, 210, 255, 0.1);
            font-size: 0.7rem;
            color: #6a7a9e;
            letter-spacing: 0.5px;
        }

        /* Responsive */
        @media (max-width: 780px) {
            body {
                padding: 16px;
            }
            .form-grid {
                grid-template-columns: 1fr;
                gap: 22px;
            }
            .input-group.full-width {
                grid-column: span 1;
            }
            .form-container {
                padding: 32px 24px;
            }
            .header {
                padding: 18px 24px;
            }
            .progress-steps {
                padding: 14px 24px;
                gap: 24px;
            }
            .action-buttons {
                flex-direction: column-reverse;
                align-items: stretch;
            }
            .back-btn, .next-btn {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .step span:not(.step-number) {
                display: none;
            }
            .step-number {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <!-- Header Section - New dark premium -->
    <header class="header">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fas fa-feather-alt"></i>
            </div>
            <h1><i class="fas fa-id-card" style="margin-right: 8px; color: #00d2ff;"></i> Profile Details</h1>
        </div>
        <div class="header-badge">
            <i class="fas fa-crown"></i> Step 1 of 2
        </div>
    </header>

    <!-- Progress indicator - redesigned -->
    <div class="progress-steps">
        <div class="step active">
            <span class="step-number">1</span>
            <span>Personal Info</span>
        </div>
    </div>

    <!-- Main Form Area - same fields, new look -->
    <div class="form-container">
        <form id="userForm" novalidate>
            <div class="form-grid">
                <!-- First Name & Surname -->
                <div class="input-group">
                    <label><i class="fas fa-star"></i> First Name *</label>
                    <input type="text" id="firstName" placeholder="e.g., Arjun" autocomplete="given-name">
                    <div class="error-msg" id="firstNameError"></div>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-star"></i> Surname *</label>
                    <input type="text" id="surname" placeholder="e.g., Mehta" autocomplete="family-name">
                    <div class="error-msg" id="surnameError"></div>
                </div>

                <!-- Profession (full width) -->
                <div class="input-group full-width">
                    <label><i class="fas fa-bolt"></i> Profession / Title *</label>
                    <input type="text" id="profession" placeholder="e.g., Full Stack Developer, AI Engineer">
                    <div class="error-msg" id="professionError"></div>
                </div>

                <!-- Email & Phone -->
                <div class="input-group">
                    <label><i class="fas fa-envelope"></i> Email Address *</label>
                    <input type="email" id="email" placeholder="hello@domain.com" autocomplete="email">
                    <div class="error-msg" id="emailError"></div>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-phone-alt"></i> Phone *</label>
                    <input type="tel" id="phone" placeholder="+91 98765 43210" autocomplete="tel">
                    <div class="error-msg" id="phoneError"></div>
                </div>

                <!-- City & Country -->
                <div class="input-group">
                    <label><i class="fas fa-city"></i> City *</label>
                    <input type="text" id="city" placeholder="Mumbai">
                    <div class="error-msg" id="cityError"></div>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-globe"></i> Country *</label>
                    <input type="text" id="country" placeholder="India">
                    <div class="error-msg" id="countryError"></div>
                </div>

                <!-- Pincode + LinkedIn -->
                <div class="input-group">
                    <label><i class="fas fa-map-marker-alt"></i> PIN Code *</label>
                    <input type="text" id="pincode" placeholder="400001" maxlength="10">
                    <div class="error-msg" id="pincodeError"></div>
                </div>
                <div class="input-group">
                    <label><i class="fab fa-linkedin"></i> LinkedIn Profile</label>
                    <input type="url" id="linkedin" placeholder="https://linkedin.com/in/username">
                    <div class="error-msg" id="linkedinError"></div>
                </div>
            </div>

            <div class="action-buttons">
                <button type="button" id="backBtn" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </button>
                <button type="button" id="nextBtn" class="next-btn">
                    Next: Summary <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </form>
    </div>

    <footer class="footer">
        <i class="fas fa-shield-alt"></i> Secure & encrypted • All fields marked * are required
    </footer>
</div>

<script>
    (function() {
        // DOM elements - same IDs maintained
        const firstName = document.getElementById('firstName');
        const surname = document.getElementById('surname');
        const profession = document.getElementById('profession');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        const city = document.getElementById('city');
        const country = document.getElementById('country');
        const pincode = document.getElementById('pincode');
        const linkedin = document.getElementById('linkedin');

        // Error span elements
        const firstNameErr = document.getElementById('firstNameError');
        const surnameErr = document.getElementById('surnameError');
        const professionErr = document.getElementById('professionError');
        const emailErr = document.getElementById('emailError');
        const phoneErr = document.getElementById('phoneError');
        const cityErr = document.getElementById('cityError');
        const countryErr = document.getElementById('countryError');
        const pincodeErr = document.getElementById('pincodeError');
        const linkedinErr = document.getElementById('linkedinError');

        // Helper functions - exactly same logic
        function clearError(inputElement, errorSpan) {
            if (inputElement) inputElement.classList.remove('error-border');
            if (errorSpan) errorSpan.innerHTML = '';
        }

        function setError(inputElement, errorSpan, message) {
            if (inputElement) {
                inputElement.classList.add('error-border');
            }
            if (errorSpan) errorSpan.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
        }

        // Validation function - exact same rules
        function validateForm() {
            let isValid = true;

            const fnVal = firstName.value.trim();
            if (fnVal === '') {
                setError(firstName, firstNameErr, 'First name is required');
                isValid = false;
            } else if (fnVal.length < 2) {
                setError(firstName, firstNameErr, 'At least 2 characters');
                isValid = false;
            } else {
                clearError(firstName, firstNameErr);
            }

            const snVal = surname.value.trim();
            if (snVal === '') {
                setError(surname, surnameErr, 'Surname is required');
                isValid = false;
            } else if (snVal.length < 2) {
                setError(surname, surnameErr, 'Enter valid surname');
                isValid = false;
            } else {
                clearError(surname, surnameErr);
            }

            const profVal = profession.value.trim();
            if (profVal === '') {
                setError(profession, professionErr, 'Profession is required');
                isValid = false;
            } else if (profVal.length < 2) {
                setError(profession, professionErr, 'Enter a valid profession');
                isValid = false;
            } else {
                clearError(profession, professionErr);
            }

            const emailVal = email.value.trim();
            const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
            if (emailVal === '') {
                setError(email, emailErr, 'Email address is required');
                isValid = false;
            } else if (!emailRegex.test(emailVal)) {
                setError(email, emailErr, 'Enter a valid email (e.g., name@domain.com)');
                isValid = false;
            } else {
                clearError(email, emailErr);
            }

            const phoneVal = phone.value.trim();
            const phoneDigits = phoneVal.replace(/[^\d+]/g, '');
            if (phoneVal === '') {
                setError(phone, phoneErr, 'Phone number is required');
                isValid = false;
            } else if (phoneDigits.length < 6 || phoneDigits.length > 15) {
                setError(phone, phoneErr, 'Phone must have 6-15 digits (numbers only)');
                isValid = false;
            } else {
                clearError(phone, phoneErr);
            }

            const cityVal = city.value.trim();
            if (cityVal === '') {
                setError(city, cityErr, 'City is required');
                isValid = false;
            } else {
                clearError(city, cityErr);
            }

            const countryVal = country.value.trim();
            if (countryVal === '') {
                setError(country, countryErr, 'Country is required');
                isValid = false;
            } else {
                clearError(country, countryErr);
            }

            const pinVal = pincode.value.trim();
            const pinRegex = /^[0-9]{4,10}$/;
            if (pinVal === '') {
                setError(pincode, pincodeErr, 'PIN code is required');
                isValid = false;
            } else if (!pinRegex.test(pinVal)) {
                setError(pincode, pincodeErr, 'PIN code must contain 4-10 digits only');
                isValid = false;
            } else {
                clearError(pincode, pincodeErr);
            }

            const linkedinVal = linkedin.value.trim();
            if (linkedinVal !== '') {
                const urlPattern = /^(https?:\/\/)/i;
                if (!urlPattern.test(linkedinVal)) {
                    setError(linkedin, linkedinErr, 'LinkedIn URL should start with http:// or https://');
                    isValid = false;
                } else if (!linkedinVal.includes('linkedin.com')) {
                    setError(linkedin, linkedinErr, 'Please enter a valid LinkedIn profile URL');
                    isValid = false;
                } else {
                    clearError(linkedin, linkedinErr);
                }
            } else {
                clearError(linkedin, linkedinErr);
            }

            return isValid;
        }

        // Save to localStorage
        function saveFormDataToLocal() {
            const formData = {
                firstName: firstName.value.trim(),
                surname: surname.value.trim(),
                profession: profession.value.trim(),
                email: email.value.trim(),
                phone: phone.value.trim(),
                city: city.value.trim(),
                country: country.value.trim(),
                pincode: pincode.value.trim(),
                linkedin: linkedin.value.trim(),
                timestamp: new Date().getTime()
            };
            localStorage.setItem('resumeUserData', JSON.stringify(formData));
        }

        // Redirect to summary
        function goToSummaryPage() {
            if (validateForm()) {
                saveFormDataToLocal();
                window.location.href = '/summary';
            } else {
                const firstErrorField = document.querySelector('.error-border');
                if (firstErrorField) {
                    firstErrorField.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        // Back button function
        function goToWelcomePage() {
            const draftData = {
                firstName: firstName.value.trim(),
                surname: surname.value.trim(),
                profession: profession.value.trim(),
                email: email.value.trim(),
                phone: phone.value.trim(),
                city: city.value.trim(),
                country: country.value.trim(),
                pincode: pincode.value.trim(),
                linkedin: linkedin.value.trim(),
                timestamp: new Date().getTime()
            };
            localStorage.setItem('resumeUserDraft', JSON.stringify(draftData));
            window.location.href = '/';
        }

        // Blur validation - same rules
        function attachBlurValidation() {
            const fields = [
                { input: firstName, error: firstNameErr, validate: () => {
                    const val = firstName.value.trim();
                    if (val === '') return 'First name required';
                    if (val.length < 2) return 'Minimum 2 chars';
                    return '';
                } },
                { input: surname, error: surnameErr, validate: () => {
                    const val = surname.value.trim();
                    if (val === '') return 'Surname required';
                    if (val.length < 2) return 'Minimum 2 chars';
                    return '';
                } },
                { input: profession, error: professionErr, validate: () => {
                    if (profession.value.trim() === '') return 'Profession required';
                    return '';
                } },
                { input: email, error: emailErr, validate: () => {
                    const val = email.value.trim();
                    if (val === '') return 'Email required';
                    if (!/^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(val)) return 'Invalid email format';
                    return '';
                } },
                { input: phone, error: phoneErr, validate: () => {
                    const val = phone.value.trim();
                    if (val === '') return 'Phone required';
                    const digits = val.replace(/[^\d+]/g, '');
                    if (digits.length < 6 || digits.length > 15) return 'Phone: 6-15 digits';
                    return '';
                } },
                { input: city, error: cityErr, validate: () => city.value.trim() === '' ? 'City required' : '' },
                { input: country, error: countryErr, validate: () => country.value.trim() === '' ? 'Country required' : '' },
                { input: pincode, error: pincodeErr, validate: () => {
                    const val = pincode.value.trim();
                    if (val === '') return 'PIN code required';
                    if (!/^[0-9]{4,10}$/.test(val)) return 'Only digits 4-10';
                    return '';
                } },
                { input: linkedin, error: linkedinErr, validate: () => {
                    const val = linkedin.value.trim();
                    if (val === '') return '';
                    if (!/^https?:\/\//i.test(val)) return 'URL must start with http:// or https://';
                    if (!val.includes('linkedin.com')) return 'Valid LinkedIn URL required';
                    return '';
                } }
            ];
            fields.forEach(field => {
                if (!field.input) return;
                field.input.addEventListener('blur', () => {
                    const errMsg = field.validate();
                    if (errMsg) {
                        setError(field.input, field.error, errMsg);
                    } else {
                        clearError(field.input, field.error);
                    }
                });
                field.input.addEventListener('input', () => {
                    const errMsg = field.validate();
                    if (errMsg === '' && field.error && field.error.innerHTML !== '') {
                        clearError(field.input, field.error);
                    } else if (errMsg !== '' && field.input.classList.contains('error-border')) {
                        const nowValid = (field.validate() === '');
                        if (nowValid) clearError(field.input, field.error);
                    }
                });
            });
        }

        function trimInputs() {
            const allInputs = [firstName, surname, profession, email, phone, city, country, pincode, linkedin];
            allInputs.forEach(inp => {
                if (inp && inp.value) inp.value = inp.value.trim();
            });
        }

        // Restore data - same logic
        function restoreData() {
            const savedData = localStorage.getItem('resumeUserData');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    if (data.firstName) firstName.value = data.firstName;
                    if (data.surname) surname.value = data.surname;
                    if (data.profession) profession.value = data.profession;
                    if (data.email) email.value = data.email;
                    if (data.phone) phone.value = data.phone;
                    if (data.city) city.value = data.city;
                    if (data.country) country.value = data.country;
                    if (data.pincode) pincode.value = data.pincode;
                    if (data.linkedin) linkedin.value = data.linkedin;
                    return;
                } catch(e) {}
            }
            const draftData = localStorage.getItem('resumeUserDraft');
            if (draftData) {
                try {
                    const draft = JSON.parse(draftData);
                    if (draft.firstName) firstName.value = draft.firstName;
                    if (draft.surname) surname.value = draft.surname;
                    if (draft.profession) profession.value = draft.profession;
                    if (draft.email) email.value = draft.email;
                    if (draft.phone) phone.value = draft.phone;
                    if (draft.city) city.value = draft.city;
                    if (draft.country) country.value = draft.country;
                    if (draft.pincode) pincode.value = draft.pincode;
                    if (draft.linkedin) linkedin.value = draft.linkedin;
                } catch(e) {}
            }
        }

        // Event listeners
        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) {
            nextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                trimInputs();
                goToSummaryPage();
            });
        }

        const backBtn = document.getElementById('backBtn');
        if (backBtn) {
            backBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const draftSnapshot = {
                    firstName: firstName.value.trim(),
                    surname: surname.value.trim(),
                    profession: profession.value.trim(),
                    email: email.value.trim(),
                    phone: phone.value.trim(),
                    city: city.value.trim(),
                    country: country.value.trim(),
                    pincode: pincode.value.trim(),
                    linkedin: linkedin.value.trim(),
                };
                localStorage.setItem('resumeUserDraft', JSON.stringify(draftSnapshot));
                window.location.href = '/';
            });
        }

        attachBlurValidation();
        restoreData();

        document.getElementById('userForm')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                trimInputs();
                goToSummaryPage();
            }
        });
    })();
</script>
</body>
</html>
