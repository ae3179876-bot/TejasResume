<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ResumeForge | Projects Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 0% 0%, #0a0f2a, #050814);
            min-height: 100vh;
            padding: 28px;
            position: relative;
        }

        /* ambient glow effect */
        .ambient-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0,210,255,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .header-section {
            text-align: center;
            margin-bottom: 44px;
            animation: floatIn 0.7s ease;
        }

        .header-section h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #ffffff, #00d2ff, #a855f7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 14px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .header-section p {
            color: #8b9dcc;
            font-size: 1.1rem;
            letter-spacing: -0.2px;
        }

        .main-card {
            background: rgba(12, 17, 38, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 55px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,210,255,0.12);
            transition: all 0.3s;
        }

        .user-banner {
            background: linear-gradient(125deg, #070b1a, #0e142f);
            padding: 32px 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            border-bottom: 1px solid rgba(0,210,255,0.2);
        }

        .user-info h2 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a5f3fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }

        .user-info .profession {
            color: #6c7eb0;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge-glow {
            background: rgba(0,210,255,0.12);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #00d2ff;
            border: 1px solid rgba(0,210,255,0.3);
        }

        .content-wrapper {
            padding: 48px;
        }

        .section-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #eef2ff;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-left: 5px solid #00d2ff;
            padding-left: 22px;
        }

        .section-title i {
            color: #00d2ff;
            font-size: 1.6rem;
        }

        .info-note {
            background: rgba(245, 158, 11, 0.08);
            border-left: 4px solid #f59e0b;
            padding: 16px 24px;
            border-radius: 20px;
            margin-bottom: 32px;
            color: #fcd34d;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(4px);
        }

        .project-card {
            background: rgba(8, 12, 28, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 30px;
            margin-bottom: 32px;
            border: 1px solid rgba(0,210,255,0.12);
            transition: all 0.3s ease;
        }

        .project-card:hover {
            border-color: rgba(0,210,255,0.35);
            transform: translateY(-4px);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.4);
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .project-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #a5f3fc;
            letter-spacing: -0.3px;
        }

        .remove-project-btn {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .remove-project-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: scale(0.97);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-weight: 600;
            color: #8b9dcc;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input, .input-group textarea {
            padding: 14px 18px;
            border: 1.5px solid #1e244a;
            border-radius: 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: rgba(5, 8, 20, 0.8);
            color: #eef2ff;
        }

        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 0 4px rgba(0,210,255,0.12);
        }

        .input-group input::placeholder, .input-group textarea::placeholder {
            color: #3f4870;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 110px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .tech-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #1a1f40, #0f132e);
            color: #00d2ff;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            margin: 4px 6px 4px 0;
            border: 1px solid rgba(0,210,255,0.2);
        }
        
        .tech-input-group {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .add-tech-btn {
            background: rgba(0,210,255,0.12);
            border: 1px solid rgba(0,210,255,0.3);
            color: #00d2ff;
            padding: 10px 22px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .add-tech-btn:hover {
            background: rgba(0,210,255,0.25);
        }

        .error-border {
            border-color: #ff4757 !important;
        }

        .error-text {
            color: #ff6b6b;
            font-size: 0.7rem;
            margin-top: 4px;
        }

        .add-project-btn {
            background: transparent;
            border: 2px dashed #00d2ff;
            color: #00d2ff;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
            margin-top: 20px;
            width: 100%;
            justify-content: center;
            font-size: 1rem;
            backdrop-filter: blur(4px);
        }

        .add-project-btn:hover {
            background: rgba(0,210,255,0.08);
            border-color: #00d2ff;
            transform: translateY(-3px);
        }

        .bottom-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 56px;
            padding-top: 36px;
            border-top: 1px solid rgba(0,210,255,0.12);
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: none;
            font-size: 0.95rem;
        }

        .nav-btn.back {
            background: rgba(30, 35, 65, 0.9);
            color: #cbd5ff;
            border: 1px solid #2a2f55;
        }

        .nav-btn.back:hover {
            background: rgba(0,210,255,0.12);
            border-color: #00d2ff;
            color: #00d2ff;
            transform: translateX(-5px);
        }

        .nav-btn.next {
            background: linear-gradient(105deg, #00d2ff, #3a7bd5);
            color: #0a0c1a;
            box-shadow: 0 8px 20px -8px rgba(0,210,255,0.4);
        }

        .nav-btn.next:hover {
            transform: translateX(5px);
            filter: brightness(1.05);
            box-shadow: 0 12px 28px -10px rgba(0,210,255,0.6);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            box-shadow: 0 10px 30px -8px rgba(0,0,0,0.4);
            transform: translateX(450px);
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 2000;
            backdrop-filter: blur(8px);
        }

        .toast.show {
            transform: translateX(0);
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            background: rgba(8, 12, 28, 0.6);
            border-radius: 32px;
            color: #8b9dcc;
            border: 1px dashed rgba(0,210,255,0.2);
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            .header-section h1 { font-size: 2rem; }
            .user-banner { padding: 24px; flex-direction: column; text-align: center; }
            .content-wrapper { padding: 24px; }
            .bottom-nav { flex-direction: column; }
            .nav-btn { width: 100%; justify-content: center; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="ambient-glow" style="top: -200px; left: -200px;"></div>
<div class="ambient-glow" style="bottom: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(168,85,247,0.08) 0%, transparent 70%);"></div>

<div class="container">
    <div class="header-section">
        <h1><i class="fas fa-cubes"></i> Projects Vault</h1>
        <p>Showcase your best work and technical expertise</p>
    </div>

    <div class="main-card">
        <div class="user-banner" id="userBanner">
            <div class="user-info">
                <h2 id="userName">Loading...</h2>
                <div class="profession">
                    <i class="fas fa-bolt" style="color:#00d2ff;"></i>
                    <span id="userProfession">-</span>
                    <span class="badge-glow"><i class="fas fa-certificate"></i> Portfolio</span>
                </div>
            </div>
            <div class="badge-glow">
                <i class="fas fa-code-branch"></i> Projects Hub
            </div>
        </div>

        <div class="content-wrapper">
            <div class="section-title">
                <i class="fas fa-folder-open"></i>
                <span>Your Project Portfolio</span>
            </div>

            <div class="info-note">
                <i class="fas fa-crown" style="font-size: 1.2rem;"></i>
                <span><strong>Important:</strong> Project Name and Description are required. All other fields are optional.</span>
            </div>

            <div id="projectsContainer">
                <!-- Projects injected here -->
            </div>

            <button class="add-project-btn" id="addProjectBtn">
                <i class="fas fa-plus-circle"></i> + Add New Project
            </button>

            <div class="bottom-nav">
                <button class="nav-btn back" onclick="goToCertification()">
                    <i class="fas fa-chevron-left"></i> Back to Certifications
                </button>
                <button class="nav-btn next" onclick="proceedToTemplate()">
                    Next: Choose Template <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast">
    <i class="fas fa-check-circle"></i>
    <span>Message</span>
</div>

<script>
    let userData = null;
    let projects = [];

    function loadUserData() {
        const storedData = localStorage.getItem('resumeUserData');
        if (storedData) {
            userData = JSON.parse(storedData);
        } else {
            const draftData = localStorage.getItem('resumeUserDraft');
            if (draftData) {
                userData = JSON.parse(draftData);
            } else {
                userData = { firstName: "Alex", surname: "Johnson", profession: "Developer" };
            }
        }
        displayUserInfo();
        loadProjectsFromStorage();
        renderProjects();
    }

    function displayUserInfo() {
        if (userData) {
            const fullName = `${userData.firstName || ''} ${userData.surname || ''}`.trim();
            document.getElementById('userName').innerHTML = `<i class="fas fa-asterisk" style="color:#00d2ff; font-size:1.2rem;"></i> ${fullName || 'Candidate'}`;
            document.getElementById('userProfession').textContent = userData.profession || 'Developer';
        }
    }

    function loadProjectsFromStorage() {
        const saved = localStorage.getItem('userProjects');
        if (saved) {
            try {
                const allProjects = JSON.parse(saved);
                if (Array.isArray(allProjects)) {
                    projects = allProjects.filter(proj => 
                        proj && typeof proj === 'object' &&
                        proj.name && proj.name.trim() !== '' &&
                        proj.description && proj.description.trim() !== ''
                    );
                } else {
                    projects = [];
                }
            } catch(e) { 
                projects = []; 
            }
        }
        
        if (projects.length === 0) {
            projects = [{
                id: Date.now(),
                name: '',
                role: '',
                technologies: [],
                startDate: '',
                endDate: '',
                description: '',
                githubLink: '',
                liveLink: ''
            }];
        }
    }

    function saveProjectsToStorage() {
        const toSave = projects.filter(proj => 
            proj.name && proj.name.trim() !== '' &&
            proj.description && proj.description.trim() !== ''
        );
        localStorage.setItem('userProjects', JSON.stringify(toSave));
    }

    function createEmptyProject() {
        return {
            id: Date.now() + Math.random(),
            name: '',
            role: '',
            technologies: [],
            startDate: '',
            endDate: '',
            description: '',
            githubLink: '',
            liveLink: ''
        };
    }

    function renderProjects() {
        const container = document.getElementById('projectsContainer');
        if (!container) return;
        
        if (!projects || projects.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-rocket" style="font-size: 3rem; margin-bottom: 16px; display: block; color:#00d2ff;"></i><strong style="font-size:1.2rem;">No projects yet</strong><br>Click the button above to showcase your work.</div>`;
            return;
        }

        container.innerHTML = '';
        projects.forEach((project, index) => {
            const card = document.createElement('div');
            card.className = 'project-card';
            card.setAttribute('data-id', project.id);
            card.innerHTML = `
                <div class="project-header">
                    <span class="project-title"><i class="fas fa-code-branch" style="margin-right: 10px; color:#00d2ff;"></i> Project ${index + 1}</span>
                    <button type="button" class="remove-project-btn" onclick="removeProject(${project.id})"><i class="fas fa-trash-alt"></i> Archive</button>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label><i class="fas fa-tag"></i> Project Name *</label>
                        <input type="text" class="project-name" value="${escapeHtml(project.name || '')}" placeholder="e.g., Neural Network Dashboard, Elysian Commerce">
                        <div class="error-text name-error" style="display: none;">Project name is required</div>
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-user-astronaut"></i> Your Role</label>
                        <input type="text" class="project-role" value="${escapeHtml(project.role || '')}" placeholder="e.g., Lead Architect, Full Stack">
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label><i class="fas fa-calendar-alt"></i> Start Date</label>
                        <input type="month" class="project-startdate" value="${project.startDate || ''}">
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-calendar-check"></i> End Date</label>
                        <input type="month" class="project-enddate" value="${project.endDate || ''}">
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-microchip"></i> Technologies Used</label>
                    <div class="tech-input-group">
                        <input type="text" class="tech-input" placeholder="e.g., React, Three.js, Python" style="flex: 1;">
                        <button type="button" class="add-tech-btn" onclick="addTechnology(this)"><i class="fas fa-plus"></i> Add Tech</button>
                    </div>
                    <div class="technologies-container" style="margin-top: 12px;">
                        ${project.technologies.map(tech => `<span class="tech-tag">⚡ ${escapeHtml(tech)} <i class="fas fa-times-circle" style="cursor: pointer; margin-left: 8px; opacity:0.7;" onclick="removeTechnology(this, ${project.id}, '${escapeHtml(tech)}')"></i></span>`).join('')}
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label><i class="fab fa-github"></i> GitHub Repo</label>
                        <input type="url" class="project-github" value="${escapeHtml(project.githubLink || '')}" placeholder="https://github.com/username/project">
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-globe"></i> Live Demo</label>
                        <input type="url" class="project-live" value="${escapeHtml(project.liveLink || '')}" placeholder="https://yourproject.com">
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-align-left"></i> Project Description *</label>
                    <textarea class="project-description" rows="4" placeholder="Describe the project's purpose, your contributions, challenges, and outcomes..."></textarea>
                    <div class="error-text desc-error" style="display: none;">Description is required</div>
                </div>
            `;

            const descTextareaElem = card.querySelector('.project-description');
            descTextareaElem.value = project.description || '';
            
            const nameInput = card.querySelector('.project-name');
            const nameError = card.querySelector('.name-error');
            const descTextarea = card.querySelector('.project-description');
            const descError = card.querySelector('.desc-error');
            const roleInput = card.querySelector('.project-role');
            const startDateInput = card.querySelector('.project-startdate');
            const endDateInput = card.querySelector('.project-enddate');
            const githubInput = card.querySelector('.project-github');
            const liveInput = card.querySelector('.project-live');

            const updateField = (field, value) => {
                const projId = parseInt(card.getAttribute('data-id'));
                const targetProj = projects.find(p => p.id === projId);
                if (targetProj) {
                    targetProj[field] = value;
                }
            };

            nameInput.addEventListener('input', (e) => {
                updateField('name', e.target.value);
                if (e.target.value.trim()) {
                    nameError.style.display = 'none';
                    nameInput.classList.remove('error-border');
                }
            });
            
            descTextarea.addEventListener('input', (e) => {
                updateField('description', e.target.value);
                if (e.target.value.trim()) {
                    descError.style.display = 'none';
                    descTextarea.classList.remove('error-border');
                }
            });
            
            roleInput.addEventListener('input', (e) => updateField('role', e.target.value));
            startDateInput.addEventListener('change', (e) => updateField('startDate', e.target.value));
            endDateInput.addEventListener('change', (e) => updateField('endDate', e.target.value));
            githubInput.addEventListener('input', (e) => updateField('githubLink', e.target.value));
            liveInput.addEventListener('input', (e) => updateField('liveLink', e.target.value));

            container.appendChild(card);
        });
    }

    function addTechnology(button) {
        const card = button.closest('.project-card');
        const techInput = card.querySelector('.tech-input');
        const tech = techInput.value.trim();
        if (!tech) return;
        
        const projId = parseInt(card.getAttribute('data-id'));
        const targetProj = projects.find(p => p.id === projId);
        if (targetProj && !targetProj.technologies.includes(tech)) {
            targetProj.technologies.push(tech);
            
            const techContainer = card.querySelector('.technologies-container');
            const techSpan = document.createElement('span');
            techSpan.className = 'tech-tag';
            techSpan.innerHTML = `⚡ ${escapeHtml(tech)} <i class="fas fa-times-circle" style="cursor: pointer; margin-left: 8px;" onclick="removeTechnology(this, ${projId}, '${escapeHtml(tech)}')"></i>`;
            techContainer.appendChild(techSpan);
            techInput.value = '';
        }
    }

    function removeTechnology(element, projId, techName) {
        const targetProj = projects.find(p => p.id === projId);
        if (targetProj) {
            targetProj.technologies = targetProj.technologies.filter(t => t !== techName);
            element.closest('.tech-tag').remove();
        }
    }

    function removeProject(id) {
        if (projects.length === 1) {
            const projIndex = projects.findIndex(p => p.id === id);
            if (projIndex !== -1) {
                projects[projIndex] = {
                    id: Date.now(),
                    name: '',
                    role: '',
                    technologies: [],
                    startDate: '',
                    endDate: '',
                    description: '',
                    githubLink: '',
                    liveLink: ''
                };
                renderProjects();
                showToast("Cleared — add project details", "info");
            }
            return;
        }
        projects = projects.filter(proj => proj.id !== id);
        renderProjects();
        showToast("Project archived", "success");
    }

    function proceedToTemplate() {
        const cards = document.querySelectorAll('.project-card');
        let hasValid = false;
        
        for (let card of cards) {
            const name = card.querySelector('.project-name').value.trim();
            const description = card.querySelector('.project-description').value.trim();
            const nameError = card.querySelector('.name-error');
            const descError = card.querySelector('.desc-error');
            const nameInput = card.querySelector('.project-name');
            const descTextarea = card.querySelector('.project-description');
            
            let cardValid = true;
            
            if (!name) {
                nameError.style.display = 'block';
                nameInput.classList.add('error-border');
                cardValid = false;
            } else {
                nameError.style.display = 'none';
                nameInput.classList.remove('error-border');
            }
            
            if (!description) {
                descError.style.display = 'block';
                descTextarea.classList.add('error-border');
                cardValid = false;
            } else {
                descError.style.display = 'none';
                descTextarea.classList.remove('error-border');
            }
            
            if (cardValid) {
                hasValid = true;
                const projId = parseInt(card.getAttribute('data-id'));
                const projIndex = projects.findIndex(p => p.id === projId);
                if (projIndex !== -1) {
                    projects[projIndex].name = name;
                    projects[projIndex].description = description;
                    projects[projIndex].role = card.querySelector('.project-role').value;
                    projects[projIndex].startDate = card.querySelector('.project-startdate').value;
                    projects[projIndex].endDate = card.querySelector('.project-enddate').value;
                    projects[projIndex].githubLink = card.querySelector('.project-github').value;
                    projects[projIndex].liveLink = card.querySelector('.project-live').value;
                }
            }
        }
        
        if (!hasValid) {
            showToast("Please fill Project Name and Description for at least one project", "error");
            return;
        }
        
        saveProjectsToStorage();
        showToast("Projects saved! Redirecting to template studio...", "success");
        setTimeout(() => {
            window.location.href = '/template-selection';
        }, 600);
    }

    function goToCertification() {
        saveProjectsToStorage();
        window.location.href = '/certification';
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.querySelector('span').textContent = message;
        toast.style.background = type === 'error' ? '#ef4444' : (type === 'info' ? '#3b82f6' : '#10b981');
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    document.getElementById('addProjectBtn').addEventListener('click', () => {
        const newProject = createEmptyProject();
        projects.push(newProject);
        renderProjects();
        showToast("New project slot added", "success");
        setTimeout(() => {
            const container = document.getElementById('projectsContainer');
            if (container.lastChild) {
                container.lastChild.scrollIntoView({ behavior: 'smooth', block: 'start' });
                const nameInput = container.lastChild.querySelector('.project-name');
                if (nameInput) nameInput.focus();
            }
        }, 100);
    });

    window.addTechnology = addTechnology;
    window.removeTechnology = removeTechnology;
    window.removeProject = removeProject;
    window.goToCertification = goToCertification;
    window.proceedToTemplate = proceedToTemplate;

    loadUserData();
</script>
</body>
</html>
